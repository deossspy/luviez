<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>luviez, mobile</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #050505;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent: #ffffff;
            --accent-dim: #a1a1aa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--accent); min-height: 100vh; overflow-x: hidden; padding-bottom: 120px; }
        
        .bg-glow { position: fixed; inset: 0; background: radial-gradient(circle at 50% -20%, #1e1e2e 0%, transparent 50%); z-index: -1; pointer-events: none; }
        .container { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 80px; }
        .logo { font-weight: 800; font-size: 1.2rem; text-transform: lowercase; }

        /* Buttons */
        .nav-btn { background: transparent; border: 1px solid var(--glass-border); color: var(--accent); padding: 8px 20px; border-radius: 100px; cursor: pointer; transition: 0.3s; }
        .nav-btn:hover { background: var(--accent); color: #000; }
        .primary-cta { background: var(--accent); color: #000; border: none; padding: 14px 30px; border-radius: 100px; font-weight: 600; cursor: pointer; transition: 0.3s; width: 100%; }
        .primary-cta:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Modals */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); display: flex; align-items: center; justify-content: center; z-index: 2000; opacity: 0; pointer-events: none; transition: 0.4s; }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .login-card, .popup-content { width: 100%; max-width: 380px; text-align: center; }

        /* Loading Spinner */
        #upload-loader { flex-direction: column; gap: 20px; }
        .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Inputs */
        input[type="text"], input[type="password"] { width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--glass-border); padding: 15px 0; color: #fff; margin-bottom: 20px; outline: none; transition: 0.3s; }
        input:focus { border-bottom-color: var(--accent); }

        /* Upload Zone */
        .upload-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 40px; background: var(--glass); border: 1px solid var(--glass-border); padding: 40px; border-radius: 24px; margin-bottom: 60px; }
        .drop-zone { border: 1px dashed var(--glass-border); border-radius: 16px; height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; color: var(--accent-dim); text-align: center; padding: 20px; }
        .preview-img { width: 80px; height: 80px; border-radius: 12px; object-fit: cover; margin-top: 10px; display: none; }

        /* Library */
        .section-label { color: var(--accent-dim); text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.1em; margin-bottom: 20px; display: block; }
        .song-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 30px; }
        .song-card { cursor: pointer; transition: 0.4s; }
        .cover-wrapper { position: relative; aspect-ratio: 1/1; border-radius: 12px; overflow: hidden; margin-bottom: 15px; background: #111; border: 1px solid var(--glass-border); }
        .song-cover { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .song-card:hover .song-cover { transform: scale(1.05); }

        /* Player Bar */
        .player-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(5,5,5,0.8); backdrop-filter: blur(30px); border-top: 1px solid var(--glass-border); padding: 20px 40px; display: flex; align-items: center; justify-content: space-between; z-index: 1500; transform: translateY(100%); transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        .player-bar.active { transform: translateY(0); }
        .player-info { display: flex; align-items: center; gap: 15px; width: 30%; cursor: pointer; }
        .player-info img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; }
        .player-center { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .seek-bar { width: 100%; max-width: 500px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; cursor: pointer; position: relative; }
        .seek-fill { height: 100%; background: #fff; width: 0%; border-radius: 2px; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="bg-glow"></div>

<div class="container">
    <header>
        <div class="logo">luviez.archive [mobile]</div>
        <div id="auth-controls"></div>
    </header>

    <div id="upload-section" class="hidden">
        <span class="section-label">create</span>
        <h2 style="font-weight: 300; font-size: 2rem; margin-bottom: 30px;">new release</h2>
        <div class="upload-grid">
            <div>
                <input type="text" id="song-name-input" placeholder="Track Title" style="font-size: 1.5rem;">
                <div id="audio-drop-zone" class="drop-zone">
                    <span id="audio-label">upload audio (MP3/WAV)</span>
                    <input type="file" id="audio-file" accept="audio/*" class="hidden">
                </div>
            </div>
            <div>
                <div id="cover-drop-zone" class="drop-zone" style="height: 100%;">
                    <span id="cover-label">artwork</span>
                    <input type="file" id="cover-file" accept="image/*" class="hidden">
                    <img id="cover-preview" class="preview-img">
                </div>
            </div>
            <button id="publish-btn" class="primary-cta" style="grid-column: span 2;" onclick="handleUpload()">publish track</button>
        </div>
    </div>

    <section>
        <span class="section-label">library</span>
        <div id="library" class="song-grid"></div>
    </section>
</div>

<div id="upload-loader" class="modal-overlay">
    <div class="spinner"></div>
    <p id="loader-text">uploading to luviez cloud...</p>
</div>

<div id="login-modal" class="modal-overlay">
    <div class="login-card">
        <h2>welcome back</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button class="primary-cta" onclick="login()">enter studio</button>
        <p onclick="toggleLogin(false)" style="margin-top:20px; color:var(--accent-dim); cursor:pointer;">cancel</p>
    </div>
</div>

<div id="song-detail-modal" class="modal-overlay">
    <div class="popup-content">
        <img id="detail-img" src="" style="width:100%; aspect-ratio:1/1; border-radius:24px; margin-bottom:30px; object-fit:cover;">
        <h2 id="detail-title">track title</h2>
        <p style="color:var(--accent-dim); margin-bottom:40px;">luviez • studio session</p>
        <button class="primary-cta" style="margin-bottom:15px;" onclick="togglePlay()">play / pause</button>
        <a id="detail-download" href="#" download class="nav-btn" style="display:block; text-align:center; padding:14px;">download track (hq)</a>
        <p onclick="closeDetails()" style="margin-top:20px; color:var(--accent-dim); cursor:pointer;">back to library</p>
    </div>
</div>

<div id="player-bar" class="player-bar">
    <div class="player-info" onclick="openDetails()">
        <img id="bar-cover" src="">
        <div>
            <p id="bar-title" style="font-weight:600;">select a track</p>
            <p style="font-size:0.8rem; color:var(--accent-dim);">luviez</p>
        </div>
    </div>
    <div class="player-center">
        <button id="master-play" onclick="togglePlay()" style="background:#fff; border:none; width:40px; height:40px; border-radius:50%; cursor:pointer;">▶</button>
        <div class="seek-bar" onclick="seek(event)">
            <div id="seek-fill" class="seek-fill"></div>
        </div>
    </div>
    <div style="width:30%; text-align:right;">
        <button class="nav-btn" onclick="openDetails()">details</button>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://nfejtzproyzxftogmalk.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5mZWp0enByb3l6eGZ0b2dtYWxrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3MTIwNzIsImV4cCI6MjA5MDI4ODA3Mn0.LlGgIkABzNfc-I5LcXECKAwIbSURRL_9ZVDPiPJln5A';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let songs = [];
    let audio = new Audio();
    let currentIdx = null;

    document.addEventListener('DOMContentLoaded', () => {
        updateUI();
        fetchSongs();
        setupDropZones();
    });

    async function fetchSongs() {
        const { data } = await _supabase.from('songs').select('*').order('created_at', { ascending: false });
        if (data) { songs = data; renderLibrary(); }
    }

    async function handleUpload() {
        const title = document.getElementById('song-name-input').value;
        const audioFile = document.getElementById('audio-file').files[0];
        const coverFile = document.getElementById('cover-file').files[0];

        if (!title || !audioFile || !coverFile) return alert("Fill everything!");

        document.getElementById('upload-loader').classList.add('active');

        try {
            const aName = `track_${Date.now()}`;
            const cName = `cover_${Date.now()}`;

            await _supabase.storage.from('audio').upload(aName, audioFile);
            await _supabase.storage.from('covers').upload(cName, coverFile);

            const { data: aUrl } = _supabase.storage.from('audio').getPublicUrl(aName);
            const { data: cUrl } = _supabase.storage.from('covers').getPublicUrl(cName);

            await _supabase.from('songs').insert([{ 
                title, 
                audio_url: aUrl.publicUrl, 
                cover_url: cUrl.publicUrl 
            }]);

            location.reload();
        } catch (e) {
            alert("Upload failed.");
            document.getElementById('upload-loader').classList.remove('active');
        }
    }

    function renderLibrary() {
        const lib = document.getElementById('library');
        lib.innerHTML = songs.map((s, i) => `
            <div class="song-card" onclick="selectSong(${i})">
                <div class="cover-wrapper"><img src="${s.cover_url}" class="song-cover"></div>
                <p style="font-weight:600;">${s.title}</p>
                <p style="font-size:0.8rem; color:var(--accent-dim);">digital single</p>
            </div>
        `).join('') || '<p>no tracks yet</p>';
    }

    function selectSong(i) {
        currentIdx = i;
        audio.src = songs[i].audio_url;
        audio.play();
        document.getElementById('player-bar').classList.add('active');
        document.getElementById('bar-title').innerText = songs[i].title;
        document.getElementById('bar-cover').src = songs[i].cover_url;
        document.getElementById('master-play').innerText = '⏸';
        updateDetailModal(songs[i]);
    }

    function togglePlay() {
        if (audio.paused) { audio.play(); document.getElementById('master-play').innerText = '⏸'; }
        else { audio.pause(); document.getElementById('master-play').innerText = '▶'; }
    }

    audio.ontimeupdate = () => {
        const p = (audio.currentTime / audio.duration) * 100;
        document.getElementById('seek-fill').style.width = `${p}%`;
    };

    function seek(e) {
        audio.currentTime = (e.offsetX / e.currentTarget.clientWidth) * audio.duration;
    }

    function updateDetailModal(s) {
        document.getElementById('detail-title').innerText = s.title;
        document.getElementById('detail-img').src = s.cover_url;
        document.getElementById('detail-download').href = s.audio_url;
    }

    function openDetails() { document.getElementById('song-detail-modal').classList.add('active'); }
    function closeDetails() { document.getElementById('song-detail-modal').classList.remove('active'); }
    function toggleLogin(s) { document.getElementById('login-modal').classList.toggle('active', s); }
    
    function login() {
        if (document.getElementById('username').value === 'luviez' && document.getElementById('password').value === 'GOXGOX123123') {
            localStorage.setItem('isLoggedIn', 'true');
            location.reload();
        }
    }

    function updateUI() {
        const logged = localStorage.getItem('isLoggedIn') === 'true';
        document.getElementById('upload-section').classList.toggle('hidden', !logged);
        document.getElementById('auth-controls').innerHTML = logged ? 
            `<button class="nav-btn" onclick="localStorage.clear();location.reload()">logout</button>` : 
            `<button class="nav-btn" onclick="toggleLogin(true)">sign in</button>`;
    }

    function setupDropZones() {
        ['audio', 'cover'].forEach(type => {
            const dz = document.getElementById(`${type}-drop-zone`);
            const input = document.getElementById(`${type}-file`);
            dz.onclick = () => input.click();
            input.onchange = () => {
                if (input.files[0]) {
                    document.getElementById(`${type}-label`).innerText = input.files[0].name;
                    if (type === 'cover') {
                        const p = document.getElementById('cover-preview');
                        p.src = URL.createObjectURL(input.files[0]);
                        p.style.display = 'block';
                    }
                }
            };
        });
    }
</script>
</body>
</html>
